<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветочная лавка мадам Дюваль</title>
    <link rel="stylesheet" href="les11.css">
</head>
<body>
    <main>
        <section class="catalog">
            <nav>
                <ul>
                    <li>
                        <a href="#" class="filter">
                            <div class="filter-icon">
                                <span class="popular">💓</span>
                            </div>
                            <div class="filter-text">Популярные</div>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="filter">
                            <div class="filter-icon">
                                <span class="high">🌻</span>
                            </div>
                            <div class="filter-text">Высокие</div>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="filter">
                            <div class="filter-icon">
                                <span class="early">🌱</span>
                            </div>
                            <div class="filter-text">Ранний посев</div>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="filter">
                            <div class="filter-icon">
                                <span class="light">🌞</span>
                            </div>
                            <div class="filter-text">Светолюбивые</div>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="filter">
                            <div class="filter-icon">
                                <span class="rare">🚿</span>
                            </div>
                            <div class="filter-text">Редкий полив</div>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="list">
                <article class="card card1">
                    <img src="roses.png" alt="Розы">
                </article>
                <article class="card card2">
                    <img src="violet.png" alt="Фиалки">
                </article>
                <article class="card card3">
                    <img src="monstera.png" alt="Монстера">
                </article>
            </div>
        </section>
        <section class="order">
            <form id="order-form" action="">
                <div class="field">
                    <input class="input" name="fullname" id="fullname" type="text" placeholder="Фамилия и имя">
                </div>
                <input type="submit" value="Заказать" class="submit-btn">
            </form>
        </section>
    </main>
    <div class="bcgr">
        <img src="bg.png" class="bg bg1">
        <img src="bg.png" class="bg bg2">
        <img src="bg.png" class="bg bg3">
        <img src="bg.png" class="bg bg4">
        <img src="bg.png" class="bg bg5">
        <img src="bg.png" class="bg bg6">
    </div>
    <script src="les11.js"></script>
</body>
</html>
